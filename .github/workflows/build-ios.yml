name: YOSI Local AI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0

      - name: Install JS Dependencies
        run: yarn install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS App
        run: |
          xcodebuild -workspace ios/PocketPal.xcworkspace \
                     -scheme PocketPal \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package Artifact
        run: |
          mkdir -p artifacts
          APP_PATH=$(find build/Build/Products -name "*.app" | head -n 1)
          zip -r artifacts/YOSI-Local-AI-Simulator.zip "$APP_PATH"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOSI-Local-AI-iOS
          path: artifacts/YOSI-Local-AI-Simulator.zip
