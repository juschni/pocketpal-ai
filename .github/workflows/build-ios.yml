name: YOSI Local AI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0

      - name: Install JS Dependencies
        run: yarn install --frozen-lockfile

      - name: Install Pods
        run: npx pod-install

      - name: Build iOS App
        run: |
          xcodebuild -workspace ios/PocketPal.xcworkspace \
                     -scheme PocketPal \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Zip & Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOSI-Local-AI-iOS
          path: build/Build/Products/Release-iphonesimulator/*.app
